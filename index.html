<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김포페이 연결 중</title>
  <script>
    window.onload = function() {
      // 1. 김포페이 앱 직접 실행 시도
      window.location.href = "intent://#Intent;scheme=gimpopay;package=gov.gimpo.gpay;end";
      
      // 2. 앱이 설치되어 있지 않거나 열리지 않을 경우를 대비한 플레이스토어 백업 링크
      setTimeout(function() {
        window.location.href = "https://play.google.com/store/apps/details?id=gov.gimpo.gpay";
      }, 1000);
    };
  </script>
</head>
<body style="text-align: center; padding-top: 50px; font-family: sans-serif;">
  <h3>김포페이 앱으로 연결 중입니다...</h3>
  <p>잠시만 기다려주세요.</p>
  <p><a href="https://play.google.com/store/apps/details?id=gov.gimpo.gpay">앱이 자동으로 열리지 않으면 여기를 누르세요.</a></p>
</body>
</html>
